openapi: 3.0.1
info:
  title: RoboSSAFYens Auth & User API
  description: 인증 및 사용자 관련 API 문서
  version: 1.0.0
servers:
  - url: http://localhost:3000/api
    description: Local server
paths:
  /auth/register:
    post:
      summary: 회원가입
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
                - confirmPassword
              properties:
                name:
                  type: string
                email:
                  type: string
                password:
                  type: string
                confirmPassword:
                  type: string
      responses:
        '201':
          description: 회원가입 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      message:
                        type: string
        '400':
          description: 잘못된 요청
        '500':
          description: 서버 오류

  /auth/login:
    post:
      summary: 로그인
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      token:
                        type: string
        '400':
          description: 잘못된 요청
        '401':
          description: 인증 실패
        '500':
          description: 서버 오류

  /users/me:
    get:
      summary: 내 정보 조회
      tags: [User]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 사용자 정보 반환
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          description: 인증 필요
        '404':
          description: 사용자 없음
        '500':
          description: 서버 오류
    patch:
      summary: 내 정보 수정
      tags: [User]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                title:
                  type: string
                image:
                  type: string
      responses:
        '200':
          description: 수정된 사용자 정보 반환
        '400':
          description: 잘못된 요청
        '401':
          description: 인증 필요
        '404':
          description: 사용자 없음
        '500':
          description: 서버 오류

  /users/change-password:
    post:
      summary: 비밀번호 변경
      tags: [User]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currentPassword
                - newPassword
                - confirmPassword
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                confirmPassword:
                  type: string
      responses:
        '200':
          description: 비밀번호 변경 성공
        '400':
          description: 잘못된 요청
        '401':
          description: 인증 실패
        '500':
          description: 서버 오류

  /users:
    get:
      summary: 사용자 목록 조회 (관리자/모더레이터)
      tags: [User]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
          description: 페이지 번호
        - in: query
          name: limit
          schema:
            type: integer
          description: 페이지 당 항목 수
      responses:
        '200':
          description: 사용자 목록 반환
        '401':
          description: 인증 필요
        '403':
          description: 권한 없음
        '500':
          description: 서버 오류

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
        title:
          type: string
        image:
          type: string
        contribution:
          type: integer
        badges:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              description:
                type: string
              image:
                type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
